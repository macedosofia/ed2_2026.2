{% extends "base.html" %}{% block content %}<h1>{{ 'Editar país' if editing else 'Cadastrar país' }}</h1><form method="post">{% for field, label in fields.items() %}<label for="{{ field }}">{{ label }}</label><input id="{{ field }}" name="{{ field }}" value="{{ country.get(field, '') }}" required {% if field == 'codigo' %}maxlength="2" pattern="[A-Za-z]{2}" {% if editing %}readonly{% endif %}{% endif %}>{% endfor %}<p><button type="submit">Salvar</button> <a href="{{ url_for('countries.country_list') }}">Cancelar</a></p></form>{% endblock %}
